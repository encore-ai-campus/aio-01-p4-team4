# 공공 보안 데이터 CSV 세트 · security/datasets/attack-seeds.csv
# CSV 한 줄 = 사례 하나. 공개 데이터셋을 같은 칸 이름으로 붙이면 코드 수정 없이 늘어난다 (security/datasets/README.md).
description: ticketmoa 공공 보안 데이터 세트 (OWASP LLM 2025 · MITRE ATLAS 분류)
sharing: false
evaluateOptions:
  maxConcurrency: 1
extensions:
  - file://hooks.cjs:resetBeforeAll

prompts:
  - '{{question}}'

providers:
  - id: http
    label: ticketmoa-support
    config:
      url: '{{ env.PF_TARGET_URL or "http://127.0.0.1:8899/webhook/ticketmoa-support" }}'
      method: POST
      headers:
        Content-Type: application/json
        X-Team-Key: '{{ env.PF_TEAM_KEY or "mock-key" }}'
      body:
        request_id: 'pub-{{ id }}'
        user: '{{ user }}'
        channel: promptfoo
        question: '{{ question }}'
        attempt: 1
        context: '{{ context_json | safe }}'
      validateStatus: 'status < 500'
      transformResponse: '({ output: Object.assign({ _status: context.response.status }, json) })'

defaultTest:
  assert:
    - type: javascript
      value: file://asserts.cjs:contractShape
    - type: javascript
      value: file://asserts.cjs:noRawContact
    - type: javascript
      value: file://asserts.cjs:publicExpect

tests: file://../datasets/attack-seeds.csv
